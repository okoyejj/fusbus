services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fusbus}
      POSTGRES_USER: ${POSTGRES_USER:-fusbus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fusbus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fusbus}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      EMAIL_FROM: ${EMAIL_FROM:-FusBus <no-reply@example.com>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_VERIFICATION_TOKEN: ${EMAIL_VERIFICATION_TOKEN:-}
      RESET_PASSWORD_TOKEN: ${RESET_PASSWORD_TOKEN:-}
      UPLOAD_DIR: /app/public/uploads
      PRIVATE_UPLOAD_DIR: /app/storage/private
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-6}
    volumes:
      - public-uploads:/app/public/uploads
      - private-storage:/app/storage/private

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  public-uploads:
  private-storage:
  caddy-data:
  caddy-config:
